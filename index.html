<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="탄수화물의 입체구조를 관찰하고 비교하는 수업용 3D 탐색기"/><title>Carbohydrate 3D Explorer · 탄수화물 구조 탐색기</title></head><body><div id="root"></div>
<!-- 조회수: 포털 공통 모듈(suimaire.github.io/assets/js/page-views.js). production 에서만 로드되며 실패해도 앱과 무관 -->
<script>
  (function () {
    try {
      if (location.hostname !== 'suimaire.github.io' && !/[?&]page-views=/.test(location.search)) return;
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'https://suimaire.github.io/assets/js/page-views.js';
      document.head.appendChild(s);
    } catch (e) {}
  })();
</script>
<script type="module" src="/src/main.tsx"></script></body></html>
